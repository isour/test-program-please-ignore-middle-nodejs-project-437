services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d appdb']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:password@db:5432/appdb
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
